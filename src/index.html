function product(id){return db.products.find(function(p){return Number(p.id)===Number(id)})}
function statusClass(v){return v==='Delivered'||v==='Settled'||v==='Active'||v==='Collected'?'green':v==='New'||v==='Making'||v==='Packed'||v==='Confirmed'?'amber':v==='Cancelled'||v==='Unpaid'?'rose':v==='Shipped'?'blue':'gray'}
function badge(text){return '<span class="badge '+statusClass(text)+'">'+escapeHTML(text)+'</span>'}
function cartCount(){return cart.reduce(function(s,it){return s+Number(it.qty)},0)}
function cartSubtotal(){return cart.reduce(function(s,it){var p=product(it.id);return s+(p?p.price*it.qty:0)},0)}
function shippingTotal(){return db.settings.freeShipping&&cartSubtotal()>=800?0:Number(db.shipping)}
function discountTotal(){if(!ui.appliedCoupon)return 0;return ui.appliedCoupon.type==='Percentage'?Math.round(cartSubtotal()*ui.appliedCoupon.value/100):Math.min(cartSubtotal(),ui.appliedCoupon.value)}
function cartTotal(){return Math.max(0,cartSubtotal()+shippingTotal()-discountTotal())}

function overview(){var total=db.orders.reduce(function(s,o){return s+o.total},0),newCount=db.orders.filter(function(o){return o.status==='New'}).length;var bar=[39,51,46,67,60,82,72], labels=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];var recent=db.orders.slice(0,5);return heading('Good morning, maker <span style="color:#d9a89b">✳</span>','Here is what is happening in your store today.',button(icon('external','sm')+' View store','goto-store','secondary'))+'<div class="stat-grid">'+stat('Total orders',db.orders.length,'+12.5% from last week','bag')+stat('Order value',money(total),'+8.2% from last week','wallet')+stat('Needs attention',newCount+' orders','Awaiting confirmation','clock')+stat('Products live',db.products.length+' items','Across '+db.collections.length+' collections','package')+'</div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><div><h2>Sales overview</h2><p>Order value over time</p></div>'+select(ui.period,'period',['Last 7 days','Last 30 days','This month'])+'</div><div class="chart-plot"><div style="display:flex;flex-direction:column;justify-content:space-between;color:#a9afa8;font-size:10px;padding-bottom:12px"><span>1.2k</span><span>900</span><span>600</span><span>300</span><span>0</span></div><div class="chart-bars">'+bar.map(function(b,i){return '<div class="chart-col '+(i===5?'highlight':'')+'"><div class="chart-bar" style="height:'+b+'%" title="'+labels[i]+': '+b+'% of chart scale"></div><span>'+labels[i]+'</span></div>'}).join('')+'</div></div><div class="chart-footer"><span class="legend">Order value (illustrative)</span><span>EGP · '+ui.period+'</span></div></section><section class="panel"><div class="panel-head"><div><h2>Popular right now</h2><p>Your most-loved pieces</p></div><button class="text-button" data-act="navigate" data-view="products">View products</button></div><div class="activity">'+db.products.slice(0,4).map(function(p,i){return '<div class="activity-row"><img class="activity-image" src="'+p.img+ ount</span><strong>-'+money(discountTotal())+'</strong></div>':'')+'<div class="sumline total"><span>Due on delivery</span><strong>'+money(cartTotal())+'</strong></div><button class="btn primary" style="width:100%;margin-top:16px;padding:15px" data-act="go-checkout">Checkout '+icon('arrow')+'</button></div>':'')+'</aside>'}

function render(){var h=location.hash.replace(/^#\/?/,'')||'shop';var bits=h.split('/');ui.route=bits[0]==='admin'?(bits[1]||'overview'):bits[0];if(ui.route==='product'&&bits[1])ui.selected=Number(bits[1]);var adminMode=bits[0]==='admin';document.title=(adminMode?'Dashboard · ':'')+'melo studio — UI preview';app.innerHTML=adminMode?admin():store();layer.innerHTML=(ui.drawer==='cart'?cartSheet():'')+modal();document.body.style.overflow=ui.modal||ui.drawer?'hidden':'';if(ui.modal){var dialog=$('.modal');if(dialog){var first=dialog.querySelector('input')||dialog.querySelector('button');if(first&&!ui.focusPreserve)first.focus({preventScroll:true})}}}
function addToCart(id,qty){var p=product(id);if(!p)return;var it=cart.find(function(c){return c.id===id});var current=it?it.qty:0;if(current+qty>p.stock){toast('Only '+p.stock+' available');return}if(it)it.qty+=qty;else cart.push({id:id,qty:qty});persist();ui.drawer='cart';render();toast('Added to bag')}
function downloadCSV(name,rows){var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');var u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));var a=document.createElement('a');a.href=u;a.download=name+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);toast('CSV exported')}
